services:
  init-secrets:
    image: postgres:16
    entrypoint: ["/bin/sh", "/init-secrets.sh"]
    environment:
      BOOTSTRAP_DB_PASSWORD: ${ENV_PROTUBE_DB_PASS:-}
    volumes:
      - db_credentials:/run/protube-secrets
      - ./deploy/init-secrets.sh:/init-secrets.sh:ro
    restart: "no"

  db:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${ENV_PROTUBE_DB_USER:-protube_user}
      POSTGRES_PASSWORD_FILE: /run/protube-secrets/db_password
      POSTGRES_DB: ${ENV_PROTUBE_DB:-protube_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - db_credentials:/run/protube-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${PROTUBE_SECURE_COOKIES:-false}
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db
      ENV_PROTUBE_DB_HOST: db
      ENV_PROTUBE_DB_PORT: "5432"
      ENV_PROTUBE_DB: ${ENV_PROTUBE_DB:-protube_db}
      ENV_PROTUBE_DB_USER: ${ENV_PROTUBE_DB_USER:-protube_user}
      ENV_PROTUBE_DB_PASS_FILE: /run/protube-secrets/db_password
      ENV_PROTUBE_STORE_DIR: /store
      ENV_PROTUBE_IMPORT_ENABLED: "false"
    ports:
      - "${PROTUBE_BIND_ADDRESS:-127.0.0.1}:${PROTUBE_HTTP_PORT:-8080}:8080"
    volumes:
      - db_credentials:/run/protube-secrets:ro
      - media_data:/store
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  postgres_data:
  db_credentials:
  media_data:
