version: "3.9"

services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${ENV_PROTUBE_DB_USER}
      POSTGRES_PASSWORD: ${ENV_PROTUBE_DB_PASS}
      POSTGRES_DB: ${ENV_PROTUBE_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
