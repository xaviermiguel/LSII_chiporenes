# Test resources only: explicitly loaded by Playwright, never packaged in production.
spring.datasource.url=jdbc:h2:mem:protube-e2e;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=${E2E_DATA_LOCATION}
spring.flyway.enabled=false
pro_tube.import.enabled=false
pro_tube.load_initial_data=false
spring.h2.console.enabled=false
server.port=18080
logging.level.org.springframework.web=WARN
