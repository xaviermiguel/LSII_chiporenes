name: Pull Request CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:ci

      - name: Set up Java for backend
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Build and test backend with coverage
        working-directory: backend
        run: |
          mvn clean verify

      - name: Install E2E browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Check visual token contrast
        working-directory: frontend
        run: npm run test:contrast

      # Upload Frontend Coverage
      - name: Upload Frontend Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: |
            frontend/coverage/
            frontend/unit-test-results/unit.json
          if-no-files-found: error

      # Upload Backend Coverage
      - name: Upload Backend Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
          if-no-files-found: error

  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: protube_test
          POSTGRES_USER: protube_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U protube_test -d protube_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ENV_PROTUBE_DB_HOST: localhost
      ENV_PROTUBE_DB_PORT: '5432'
      ENV_PROTUBE_DB: protube_test
      ENV_PROTUBE_DB_USER: protube_test
      ENV_PROTUBE_DB_PASS: test-only-password
      RUN_CATALOG_POSTGRES_TESTS: 'true'
      RUN_POSTGRES_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'
      - name: Verify with a dedicated PostgreSQL database
        working-directory: backend
        run: mvn --batch-mode clean verify
      - name: Upload PostgreSQL test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          if-no-files-found: error
